# CI/CD: every push is type-checked and tested; when everything passes on `main`,
# the game is built and published to GitHub Pages.
#
#   test  ->  build  ->  deploy
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". The site is then at https://<user>.github.io/<repo>/.
#
# Bun only (see CLAUDE.md): no npm / npx / yarn / pnpm, and bun.lock is the lockfile.
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it needs below.
permissions:
  contents: read

# A newer push to the same ref supersedes an older run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.13'

jobs:
  test:
    name: Type-check and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Run the tests
        run: bun run test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun's package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Type-checks again and bundles into dist/. On branches other than main this
      # only proves the project builds; nothing is published from them.
      - name: Build
        run: bun run build

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploys queue up instead of cancelling one that is already publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
